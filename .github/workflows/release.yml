# release.yml
# Description: builds LogIT for Windows, macOS and Linux on their own runners and
#              assembles the four files into one DRAFT GitHub release. Two of the
#              three platforms cannot be built on the author's machine at all,
#              which is why this exists. Nothing here publishes: the draft is
#              visible only to the author until she publishes it by hand.
# Inputs:  a push to main whose package.json version has no published release yet,
#          or a manual dispatch
# Outputs: a draft release tagged v<version> carrying the four artifacts
# Created: 2026-10-24

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession would otherwise both see "no release yet" and
# both create a draft — GitHub does not enforce tag uniqueness for drafts,
# because a draft creates no tag. One release run at a time.
concurrency:
  group: release
  cancel-in-progress: true

# Read by default: the three build jobs package an app and must not be able to
# touch releases at all. Only gate and release widen this.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # Decides whether this push is a release at all. A documentation commit on main
  # is an ordinary push — without this, every one of them would cut a release.
  gate:
    name: Should this version build?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      replace_draft: ${{ steps.decide.outputs.replace_draft }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh release list --json tagName,isDraft --limit 100)
          node scripts/release-gate.mjs "$releases"

  build:
    name: Build ${{ matrix.artifact }}
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Report all three outcomes rather than cancelling the others on the first
      # failure — when a platform breaks, knowing whether the other two are fine
      # is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            builder_flag: --win
            files: |
              release/LogIT-*-Windows-Installer.exe
              release/LogIT-*-Windows-Portable.exe
          - os: macos-latest
            artifact: macos
            builder_flag: --mac
            files: release/LogIT-*-macOS.dmg
          - os: ubuntu-latest
            artifact: linux
            builder_flag: --linux
            files: release/LogIT-*-Linux.AppImage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the headless suites
        run: npm test

      - name: Generate the icons and the dmg background
        run: npm run icons

      # build/ is gitignored, so these exist only because the step above made
      # them. Without this guard electron-builder would quietly package the
      # default Electron icon and ship a release that looks like someone
      # else's app.
      - name: Fail if a generated build asset is missing
        shell: bash
        run: |
          for asset in build/icon.ico build/icon.png build/dmg-background.png build/dmg-background@2x.png; do
            if [ ! -f "$asset" ]; then
              echo "missing $asset — build/ is gitignored, so npm run icons must produce it"
              exit 1
            fi
            echo "ok: $asset ($(wc -c < "$asset") bytes)"
          done

      - name: Build the renderer bundle
        run: npm run build:renderer

      # --publish never is a safety rail, not a formality: electron-builder can
      # publish to GitHub on its own when a token is present, and a release that
      # appears without the author publishing it is this design's worst outcome.
      - name: Package ${{ matrix.artifact }}
        run: npx electron-builder ${{ matrix.builder_flag }} --publish never

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # `needs` requires every build leg to have succeeded, so a single platform
  # failure means this job never runs. A draft quietly missing its macOS file
  # could be published without the absence being noticed; one red run cannot.
  release:
    name: Assemble the draft release
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Collect the artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Render the release notes
        run: node scripts/render-release-notes.mjs release-notes.md

      # The gate narrows this risk but does NOT eliminate it, and an earlier
      # version of this comment wrongly claimed it did. Two ways a published
      # release can reach a delete that was decided minutes ago:
      #   1. The gate saw a draft, then the builds ran for several minutes. If
      #      the author published that draft in the meantime, the tag now names
      #      a published release.
      #   2. If a draft and a published release share the tag, `gh release list`
      #      shows the draft while `gh release delete <tag>` resolves the
      #      published one — the gate and the delete disagree about the target.
      # So re-check immediately before deleting, through the same tag-resolution
      # path gh itself uses. Destroying a published release is anti-goal 6.
      - name: Replace the previous draft
        if: needs.gate.outputs.replace_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh release view "${{ needs.gate.outputs.tag }}" --json isDraft -q .isDraft)
          if [ "$state" != "true" ]; then
            echo "refusing to delete ${{ needs.gate.outputs.tag }}: it resolves to a PUBLISHED release"
            exit 1
          fi
          gh release delete "${{ needs.gate.outputs.tag }}" --yes

      # --target pins the tag to the commit these artifacts were built from. Without
      # it the tag is created at the default branch's head when the draft is
      # published, so a dispatch from a feature branch would attach this branch's
      # binaries to a tag pointing at main.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.gate.outputs.tag }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "${{ needs.gate.outputs.tag }}" \
            --notes-file release-notes.md \
            artifacts/*

      - name: Say where it went
        run: |
          echo "Draft release ${{ needs.gate.outputs.tag }} created with:"
          ls -1 artifacts/
          echo "It is NOT public. Publish it yourself once you have checked it."
